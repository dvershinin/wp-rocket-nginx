# Generated configuration files live in the uploads directory by default.
# Never serve them, or files left in the pre-1.2.0 location, to HTTP clients.
location ~* /(?:getpagespeed-cache-configuration|wp-rocket-nginx)/.*\.conf$ {
    deny all;
}

# Lets the plugin's settings page confirm that Nginx loaded this exact file.
location = /getpagespeed-cache-configuration-probe {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store";
    return 200 "gpscc:{{integration_id}}:{{fingerprint}}";
}
