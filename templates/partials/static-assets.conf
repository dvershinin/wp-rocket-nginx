# Nginx serves static assets directly from disk.
location ~* \.css$ {
    etag on;
    gzip_vary on;
    expires {{css_expiration}};

    {{include_global}}
    {{include_css}}
}

location ~* \.js$ {
    etag on;
    gzip_vary on;
    expires {{js_expiration}};

    {{include_global}}
    {{include_js}}
}

location ~* \.({{media_extensions}})$ {
    etag on;
    expires {{media_expiration}};

    {{include_global}}
    {{include_media}}
}
