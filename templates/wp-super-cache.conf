###################################################################################################
# GetPageSpeed Cache Configuration
#
# Serves WP Super Cache static files directly from Nginx without loading PHP.
# Generated by https://github.com/dvershinin/getpagespeed-cache-configuration
# Applies the same conditions as the mod_rewrite rules WP Super Cache writes for Apache.
###################################################################################################

set $gpscc_debug {{debug}};

set $gpscc_serve    1;
set $gpscc_status   "MISS";
set $gpscc_reason   "";
set $gpscc_suffix   "";

# Custom start includes.
{{include_start}}

# WP Super Cache names cache directories after the request path exactly as the client sent it,
# so the lookup uses $request_uri instead of the decoded and normalized $uri. A path containing
# uppercase letters is stored lowercased, is not found here, and is answered by PHP.
set $gpscc_uri_path $request_uri;
if ($request_uri ~ "^([^?]*)\?") {
    set $gpscc_uri_path $1;
}
set $gpscc_dir $gpscc_uri_path;
if ($gpscc_uri_path ~ "^(.*)/$") {
    set $gpscc_dir $1;
}

# HTTPS pages are cached separately. WP Super Cache detects HTTPS from these two signals only.
if ($https = "on") { set $gpscc_suffix "-https"; }
if ($http_x_forwarded_proto ~* "^https$") { set $gpscc_suffix "-https"; }

# Strip the tracking parameters WP Super Cache is configured to ignore.
{{query_string_ignore}}

# Custom preprocess includes may change $gpscc_dir or $gpscc_suffix.
{{include_preprocess}}

set $gpscc_url "/{{cache_uri}}/$host$gpscc_dir/index$gpscc_suffix.html";
set $gpscc_file "$document_root$gpscc_url";

{{gzip_lookup}}

if (!-f "$gpscc_file") {
    set $gpscc_serve 0;
    set $gpscc_status "MISS";
    set $gpscc_reason "File not cached";
}
if ($request_method !~ "^(GET|HEAD)$") {
    set $gpscc_serve 0;
    set $gpscc_status "BYPASS";
    set $gpscc_reason "Request method";
}
if ($gpscc_args != "") {
    set $gpscc_serve 0;
    set $gpscc_status "BYPASS";
    set $gpscc_reason "Arguments found";
}
if ($gpscc_uri_path ~ "\.\.|//") {
    set $gpscc_serve 0;
    set $gpscc_status "BYPASS";
    set $gpscc_reason "Unsafe path";
}
{{trailing_slash_guard}}
if (-f "$document_root/.maintenance") {
    set $gpscc_serve 0;
    set $gpscc_status "BYPASS";
    set $gpscc_reason "Maintenance mode";
}
if ($http_cookie ~* "({{cookie_bypass}})") {
    set $gpscc_serve 0;
    set $gpscc_status "BYPASS";
    set $gpscc_reason "Cookie";
}
{{any_cookie_guard}}
if ($http_x_wap_profile != "") {
    set $gpscc_serve 0;
    set $gpscc_status "BYPASS";
    set $gpscc_reason "Mobile profile header";
}
if ($http_profile != "") {
    set $gpscc_serve 0;
    set $gpscc_status "BYPASS";
    set $gpscc_reason "Mobile profile header";
}
{{mobile_guard}}

if ($gpscc_serve = 1) {
    set $gpscc_status "HIT";
    set $gpscc_reason "$gpscc_url";
}
if ($gpscc_debug = 0) {
    set $gpscc_reason "";
    set $gpscc_file "";
}
if ($gpscc_serve = 1) {
    rewrite .* "$gpscc_url" last;
}

{{partial_protect}}

# Cache files are reachable only through the rewrite above, never by requesting them directly.
location ~ ^/{{cache_uri_regex}}/.*\.html$ {
    internal;
    etag on;
    {{charset}}
    add_header Vary "{{html_vary}}";
    add_header Cache-Control "{{html_cache_control}}";
    add_header X-GetPageSpeed-Cache $gpscc_status always;
    add_header X-GetPageSpeed-Cache-Reason $gpscc_reason always;
    add_header X-GetPageSpeed-Cache-File $gpscc_file always;

    {{include_global}}
    {{include_http}}
}

location ~ ^/{{cache_uri_regex}}/.*\.html\.gz$ {
    internal;
    etag on;
    gzip off;
    types {}
    default_type text/html;
    {{charset}}
    add_header Content-Encoding gzip;
    add_header Vary "{{html_vary}}";
    add_header Cache-Control "{{html_cache_control}}";
    add_header X-GetPageSpeed-Cache $gpscc_status always;
    add_header X-GetPageSpeed-Cache-Reason $gpscc_reason always;
    add_header X-GetPageSpeed-Cache-File $gpscc_file always;

    {{include_global}}
    {{include_http}}
}

add_header X-GetPageSpeed-Cache $gpscc_status always;
add_header X-GetPageSpeed-Cache-Reason $gpscc_reason always;
add_header X-GetPageSpeed-Cache-File $gpscc_file always;

{{include_global}}

{{partial_static_assets}}
